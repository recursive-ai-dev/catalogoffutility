<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog of Futility</title>

    <!--
      This description is the canonical default. It must match SITE_DESCRIPTION
      in src/lib/constants.ts — App.tsx restores this exact string when leaving
      an entry view, and src/test/site.test.tsx asserts the two agree.
    -->
    <meta name="description" content="A brutalist archive of digital artifacts, simulations, and interactive tragedies." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Catalog of Futility" />
    <meta property="og:description" content="A brutalist archive of digital artifacts, simulations, and interactive tragedies." />
    <meta property="og:site_name" content="Catalog of Futility" />
    <!-- Same banner asset the README uses, so the preview matches the repo. -->
    <meta property="og:image" content="https://github.com/user-attachments/assets/0aa67016-6eaf-4554-a0b5-a7a51a8e05ce" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Catalog of Futility" />
    <meta name="twitter:description" content="A brutalist archive of digital artifacts, simulations, and interactive tragedies." />
    <meta name="twitter:image" content="https://github.com/user-attachments/assets/0aa67016-6eaf-4554-a0b5-a7a51a8e05ce" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./site.webmanifest">

    <!-- Preconnect to Google Fonts to reduce latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
