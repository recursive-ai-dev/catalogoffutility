<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0a0a1a"/>
  <!-- Neural architecture under construction -->
  <g stroke="#4ade80" stroke-width="1.5" opacity="0.35">
    <line x1="180" y1="150" x2="330" y2="120"/>
    <line x1="180" y1="150" x2="330" y2="220"/>
    <line x1="180" y1="300" x2="330" y2="220"/>
    <line x1="180" y1="300" x2="330" y2="320"/>
