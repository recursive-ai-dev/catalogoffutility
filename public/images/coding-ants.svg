    <circle cx="246" cy="132" r="3.5"/>
    <ellipse cx="255" cy="285" rx="9" ry="5"/>
    <circle cx="246" cy="282" r="3.5"/>
    <ellipse cx="405" cy="220" rx="9" ry="5"/>
    <circle cx="396" cy="217" r="3.5"/>
